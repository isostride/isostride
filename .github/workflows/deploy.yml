# CI/CD (the runner's request of 23 Nov 2026: "chce przeniesc wszystko na pipleline i miec poprawne
# ci/cd", then "testwy trwaja dlugo ... mozesz je zrownoleglic na github ?"): on each push and pull
# request the whole check of the app (npm run check: unit, integration and end-to-end tests, the
# shuffled run, boundaries, budgets, radical check against the model), its stages as jobs side by
# side (scripts/check.sh <stage>), the runner's FIT files fetched from a private S3 bucket; their
# reports handed to the verdict through the same bucket (ci/<run>/, gone after 3 days), as the
# repository, its logs and its artifacts are public. On master, once everything passes, the very build
# the end-to-end tests ran against goes to app.isostride.com and the site to isostride.com. AWS is
# reached with OIDC (infra/github.tf, infra/ci.tf): no keys in GitHub.
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_CI_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
  TEST_DATA_BUCKET: ${{ vars.TEST_DATA_BUCKET }}
  # Where the jobs of this run leave their reports for the verdict.
  REPORTS: s3://${{ vars.TEST_DATA_BUCKET }}/ci/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  tests:
    name: unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests
        working-directory: apps/app
        run: sh scripts/check.sh tests
      - name: Reports for the verdict
        if: ${{ !cancelled() }}
        working-directory: apps/app
        run: aws s3 cp reports "$REPORTS/tests" --recursive --only-show-errors

  shuffled:
    name: tests in random order
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Fitness functions "Tests pass in any order" and "Flaky tests enter quarantine": the suite three
      # times in random order, a failed test retried once.
      - name: Tests in random order
        working-directory: apps/app
        run: sh scripts/nightly.sh
      - name: Reports for the verdict
        if: ${{ !cancelled() }}
        working-directory: apps/app
        run: aws s3 cp reports/measures-nightly.json "$REPORTS/shuffled/measures-nightly.json" --only-show-errors

  e2e:
    name: end-to-end tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      # Builds the app (the tests run against its static export) and runs a third of Chromium's tests;
      # WebKit's own test runs in its own job, so only Chromium's few system libraries are installed here.
      - name: End-to-end tests
        working-directory: apps/app
        run: sh scripts/check.sh e2e ${{ matrix.shard }}/3 chromium
      - name: Reports for the verdict
        if: ${{ !cancelled() }}
        working-directory: apps/app
        run: |
          [ -f reports/measures-e2e.json ] && aws s3 cp reports/measures-e2e.json "$REPORTS/e2e-${{ matrix.shard }}/measures-e2e.json" --only-show-errors
          aws s3 cp reports/timing-e2e.json "$REPORTS/e2e-${{ matrix.shard }}/timing-e2e.json" --only-show-errors
          aws s3 cp reports/blob "$REPORTS/e2e-${{ matrix.shard }}/blob" --recursive --only-show-errors
      # The build the tests ran against: the one measured against the budget and deployed.
      - name: The build for the verdict
        if: matrix.shard == 1
        run: tar -czf - apps/app/.next-build | aws s3 cp - "$REPORTS/build/app.tgz" --only-show-errors

  # WebKit (Safari) gets the not-supported message: in Playwright's image, whose system libraries are
  # there already (installing WebKit's took up to 7 minutes). It reads none of the runner's files, so
  # its report goes as an ordinary artifact.
  e2e-webkit:
    name: end-to-end tests in WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: End-to-end tests in WebKit
        working-directory: apps/app
        env:
          HOME: /root
        run: sh scripts/check.sh e2e 1/1 webkit
      - name: Report for the verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-webkit
          path: |
            apps/app/reports/blob
            apps/app/reports/measures-e2e.json
            apps/app/reports/timing-e2e.json
          retention-days: 1

  static:
    name: boundaries, frameworks, lint, site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          fit-files: 'false'
      - name: Boundaries, frameworks, lint
        working-directory: apps/app
        run: |
          npx tsc --noEmit
          sh scripts/check.sh static
      - name: Reports for the verdict
        if: ${{ !cancelled() }}
        working-directory: apps/app
        run: aws s3 cp reports "$REPORTS/static" --recursive --only-show-errors
      - name: Check and build the site
        run: |
          (cd apps/site && npx tsc --noEmit)
          npm run build:site
          tar -czf - apps/site/.next-build | aws s3 cp - "$REPORTS/build/site.tgz" --only-show-errors

  # The verdict, under the name the protection of master requires: every report of the run judged
  # against the model (radical check); it runs when a job before it failed too, so its report is whole.
  check:
    name: check
    needs: [tests, shuffled, e2e, e2e-webkit, static]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Two commits: the coverage of new code compares the commit with the one before it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          fit-files: 'false'
      - name: WebKit's report
        uses: actions/download-artifact@v8
        with:
          name: e2e-webkit
          path: apps/app/ci/e2e-webkit
      - name: The run's reports
        working-directory: apps/app
        run: |
          aws s3 cp "$REPORTS" ci --recursive --only-show-errors
          mkdir -p reports reports/blob
          cp -R ci/tests/. reports/ 2>/dev/null || true
          cp -R ci/static/. reports/ 2>/dev/null || true
          cp ci/shuffled/measures-nightly.json reports/ 2>/dev/null || true
          # Each shard's blob under its job's name: two shards may name theirs alike (report-1.zip).
          for d in ci/e2e-*; do for f in "$d"/blob/*.zip; do [ -f "$f" ] && cp "$f" "reports/blob/$(basename "$d")-$(basename "$f")"; done; done
          # The end-to-end shards' measures and times as one run's: the longest shard is the wall time.
          node -e '
          const fs = require("fs"), path = require("path");
          const dirs = fs.readdirSync("ci").filter((d) => d.startsWith("e2e-")).map((d) => path.join("ci", d));
          const read = (f) => (fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : {});
          fs.writeFileSync("reports/measures-e2e.json", JSON.stringify(Object.assign({}, ...dirs.map((d) => read(path.join(d, "measures-e2e.json"))))));
          fs.writeFileSync("reports/timing-e2e.json", JSON.stringify({ e2eSeconds: Math.max(0, ...dirs.map((d) => read(path.join(d, "timing-e2e.json")).e2eSeconds ?? 0)) }));
          '
          PLAYWRIGHT_JSON_OUTPUT_NAME=reports/playwright.json npx playwright merge-reports --reporter=json reports/blob
          tar -xzf ci/build/app.tgz -C ../..
          rm -rf ci
      - name: Verdict
        working-directory: apps/app
        run: sh scripts/check.sh verdict
      - name: The builds for the deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          aws s3 cp "$REPORTS/build/site.tgz" - | tar -xzf -
          tar -czf builds.tgz apps/app/.next-build apps/site/.next-build
      - name: Keep the builds for the deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: builds
          path: builds.tgz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [tests, shuffled, e2e, e2e-webkit, static, check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: builds
      - run: tar -xzf builds.tgz

      - name: Sign in to AWS (deploy)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The hashed files kept a year (a new build has new names), the rest checked on every visit;
      # old hashed files stay, so a page open during a deploy still finds its scripts.
      - name: Deploy the app
        run: |
          aws s3 sync apps/app/.next-build/_next/static "s3://${{ vars.APP_BUCKET }}/_next/static" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/app/.next-build "s3://${{ vars.APP_BUCKET }}" --delete --exclude "_next/static/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.APP_DISTRIBUTION_ID }}" --paths "/*"

      - name: Deploy the site
        run: |
          aws s3 sync apps/site/.next-build/_next/static "s3://${{ vars.SITE_BUCKET }}/_next/static" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/site/.next-build "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "_next/static/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" --paths "/*"
