# CI/CD (the runner's request of 23 Nov 2026: "chce przeniesc wszystko na pipleline i miec poprawne
# ci/cd", then "testwy trwaja dlugo ... mozesz je zrownoleglic na github ?"): on each push and pull
# request the whole check of the app (npm run check: unit, integration and end-to-end tests, the
# shuffled run, boundaries, budgets, radical check against the model), its stages as jobs side by
# side (scripts/check.sh <stage>), the runner's FIT files fetched from a private S3 bucket; their
# reports handed to the verdict through the same bucket (ci/<run>/, gone after 3 days), as the
# repository, its logs and its artifacts are public; the tests' own output goes there too
# (scripts/quiet.mjs), the log naming only the tests that failed. On master, once everything passes, the very build
# the end-to-end tests ran against goes to app.isostride.com and the site to isostride.com. AWS is
# reached with OIDC (infra/github.tf, infra/ci.tf): no keys in GitHub.
#
# A tree is checked once (the runner's request of 26 Nov 2026: "chce aby ci/cd dzialal stabilnie ...
# jesli check przechodzi na branchu to pwinien przechodzic na merge do main"): master takes a pull
# request only when its branch is up to date and its check green, so the commit a merge leaves on
# master holds the very tree that check ran on. A check that passes leaves the tree's hash in the
# bucket (ci/checked/<tree>, gone after 3 days like the reports); a push to master whose tree is there
# runs no test again (a test that fails one time in many had stopped a deploy on 26 Nov 2026 after a
# green pull request), builds the app and the site with master's commit and deploys them. A tree not
# there (a push straight to master, a mark gone) is checked whole, as before.
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_CI_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
  TEST_DATA_BUCKET: ${{ vars.TEST_DATA_BUCKET }}
  # Where the jobs of this run leave their reports for the verdict: by the run, whatever the attempt. With
  # the attempt in it, "Re-run failed jobs" could never pass: the verdict of the second attempt read only
  # the reports of the jobs run again, and failed on those of the jobs that had passed in the first.
  REPORTS: s3://${{ vars.TEST_DATA_BUCKET }}/ci/${{ github.run_id }}

jobs:
  # Whether this tree passed the check before: asked on master and on a run started by hand, never on a
  # pull request, whose check is the one that counts.
  known:
    name: tree checked before
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      checked: ${{ steps.tree.outputs.checked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to AWS (the marks of the trees checked)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: The tree and its mark
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          checked=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && aws s3api head-object --bucket "$TEST_DATA_BUCKET" --key "ci/checked/$tree" >/dev/null 2>&1; then checked=true; fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          echo "tree $tree, checked before: $checked"

  tests:
    name: unit and integration tests
    needs: known
    if: needs.known.outputs.checked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Tests
        working-directory: apps/app
        run: sh scripts/check.sh tests
      - name: Reports for the verdict
        if: ${{ !cancelled() }}
        working-directory: apps/app
        run: aws s3 cp reports "$REPORTS/tests" --recursive --only-show-errors

  shuffled:
    name: tests in random order
    needs: known
    if: needs.known.outputs.checked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Fitness functions "Tests pass in any order" and "Flaky tests enter quarantine": the suite three
      # times in random order, a failed test retried once.
      - name: Tests in random order
        working-directory: apps/app
        run: sh scripts/nightly.sh
      - name: Reports for the verdict
        if: ${{ !cancelled() }}
        working-directory: apps/app
        run: |
          aws s3 cp reports/measures-nightly.json "$REPORTS/shuffled/measures-nightly.json" --only-show-errors
          # The runs' own output (kept out of this public log by scripts/quiet.mjs).
          aws s3 cp reports "$REPORTS/shuffled" --recursive --exclude "*" --include "log-*.txt" --only-show-errors

  e2e:
    name: end-to-end tests ${{ matrix.shard }}/3
    needs: known
    if: needs.known.outputs.checked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      # Builds the app (the tests run against its static export) and runs a third of Chromium's tests;
      # WebKit's own test runs in its own job, so only Chromium's few system libraries are installed here.
      - name: End-to-end tests
        working-directory: apps/app
        run: sh scripts/check.sh e2e ${{ matrix.shard }}/3 chromium
      - name: Reports for the verdict
        if: ${{ !cancelled() }}
        working-directory: apps/app
        run: |
          [ -f reports/measures-e2e.json ] && aws s3 cp reports/measures-e2e.json "$REPORTS/e2e-${{ matrix.shard }}/measures-e2e.json" --only-show-errors
          aws s3 cp reports/timing-e2e.json "$REPORTS/e2e-${{ matrix.shard }}/timing-e2e.json" --only-show-errors
          aws s3 cp reports/blob "$REPORTS/e2e-${{ matrix.shard }}/blob" --recursive --only-show-errors
          # The tests' own output (kept out of this public log by scripts/quiet.mjs).
          aws s3 cp reports "$REPORTS/e2e-${{ matrix.shard }}" --recursive --exclude "*" --include "log-*.txt" --only-show-errors
      # The build the tests ran against: the one measured against the budget and deployed. Handed on as an
      # artifact of this run, not through the bucket: what the deploy ships must not pass through a place
      # another run (a pull request's) can write to (the review of 26 Nov 2026). It holds no file of the runner.
      - name: Pack the build
        if: matrix.shard == 1
        run: tar -czf app.tgz apps/app/.next-build
      - name: The build for the verdict
        if: matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-app
          path: app.tgz
          retention-days: 1
          if-no-files-found: error

  # WebKit (Safari) gets the not-supported message: in Playwright's image, whose system libraries are
  # there already (installing WebKit's took up to 7 minutes). It reads none of the runner's files, so
  # its report goes as an ordinary artifact.
  e2e-webkit:
    name: end-to-end tests in WebKit
    needs: known
    if: needs.known.outputs.checked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: End-to-end tests in WebKit
        working-directory: apps/app
        env:
          HOME: /root
        run: sh scripts/check.sh e2e 1/1 webkit
      - name: Report for the verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-webkit
          path: |
            apps/app/reports/blob
            apps/app/reports/measures-e2e.json
            apps/app/reports/timing-e2e.json
            apps/app/reports/log-e2e.txt
          retention-days: 1

  static:
    name: boundaries, frameworks, lint, site
    needs: known
    if: needs.known.outputs.checked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          fit-files: 'false'
      - name: Boundaries, frameworks, lint
        working-directory: apps/app
        run: |
          npx tsc --noEmit
          sh scripts/check.sh static
      - name: Reports for the verdict
        if: ${{ !cancelled() }}
        working-directory: apps/app
        run: aws s3 cp reports "$REPORTS/static" --recursive --only-show-errors
      - name: Check and build the site
        run: |
          (cd apps/site && npx tsc --noEmit)
          npm run build:site
          tar -czf site.tgz apps/site/.next-build
      - name: The site's build for the deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-site
          path: site.tgz
          retention-days: 1
          if-no-files-found: error

  # The verdict, under the name the protection of master requires: every report of the run judged
  # against the model (radical check); it runs when a job before it failed too, so its report is whole.
  check:
    name: check
    needs: [known, tests, shuffled, e2e, e2e-webkit, static]
    # Left out only for a tree checked before; should the job that asks fail, it runs and fails with the
    # reports missing, so a pull request never passes on a check that did not run.
    if: ${{ !cancelled() && needs.known.outputs.checked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Two commits: the coverage of new code compares the commit with the one before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          fit-files: 'false'
      - name: WebKit's report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-webkit
          path: apps/app/ci/e2e-webkit
      # The builds of this run: missing when their job failed, and the verdict then fails on them.
      - name: The app's build
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-app
          path: builds
      - name: The site's build
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-site
          path: builds
      - name: The run's reports
        working-directory: apps/app
        run: |
          aws s3 cp "$REPORTS" ci --recursive --only-show-errors
          mkdir -p reports reports/blob
          cp -R ci/tests/. reports/ 2>/dev/null || true
          cp -R ci/static/. reports/ 2>/dev/null || true
          cp ci/shuffled/measures-nightly.json reports/ 2>/dev/null || true
          # Each shard's blob under its job's name: two shards may name theirs alike (report-1.zip).
          for d in ci/e2e-*; do for f in "$d"/blob/*.zip; do [ -f "$f" ] && cp "$f" "reports/blob/$(basename "$d")-$(basename "$f")"; done; done
          # The end-to-end shards' measures and times as one run's: the longest shard is the wall time.
          node -e '
          const fs = require("fs"), path = require("path");
          const dirs = fs.readdirSync("ci").filter((d) => d.startsWith("e2e-")).map((d) => path.join("ci", d));
          const read = (f) => (fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : {});
          fs.writeFileSync("reports/measures-e2e.json", JSON.stringify(Object.assign({}, ...dirs.map((d) => read(path.join(d, "measures-e2e.json"))))));
          fs.writeFileSync("reports/timing-e2e.json", JSON.stringify({ e2eSeconds: Math.max(0, ...dirs.map((d) => read(path.join(d, "timing-e2e.json")).e2eSeconds ?? 0)) }));
          '
          PLAYWRIGHT_JSON_OUTPUT_NAME=reports/playwright.json npx playwright merge-reports --config playwright.merge.config.ts --reporter=json reports/blob
          tar -xzf ../../builds/app.tgz -C ../..
          rm -rf ci
      - name: Verdict
        working-directory: apps/app
        run: sh scripts/check.sh verdict
      # The test reports the verdict read, for the git hooks of a clone (radical check --from-ci, the
      # artifact .radical/model/check.json names): Studio shows the tests of CI, not of the last local run.
      - name: Keep the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            apps/app/reports/vitest.json
            apps/app/reports/playwright.json
          retention-days: 30
          if-no-files-found: warn
      # The tree passed: its mark, so a push to master of the same tree runs no test again. Only when
      # every job before the verdict passed too.
      - name: Mark the tree as checked
        if: ${{ success() && needs.tests.result == 'success' && needs.shuffled.result == 'success' && needs.e2e.result == 'success' && needs.e2e-webkit.result == 'success' && needs.static.result == 'success' }}
        run: echo "${{ github.run_id }}-${{ github.run_attempt }} ${{ github.sha }}" | aws s3 cp - "s3://${TEST_DATA_BUCKET}/ci/checked/${{ needs.known.outputs.tree }}" --only-show-errors
      - name: The builds for the deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          tar -xzf builds/site.tgz
          tar -czf builds.tgz apps/app/.next-build apps/site/.next-build
      - name: Keep the builds for the deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builds
          path: builds.tgz
          retention-days: 1
          if-no-files-found: error

  # A tree checked before (on its pull request): no test again, the app and the site built with this
  # commit, as the deploy takes them.
  build:
    name: build of a tree checked before
    needs: known
    if: needs.known.outputs.checked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          fit-files: 'false'
      - name: Build the app and the site
        run: |
          npm run -s build
          tar -czf builds.tgz apps/app/.next-build apps/site/.next-build
      - name: Keep the builds for the deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builds
          path: builds.tgz
          retention-days: 1
          if-no-files-found: error

  # After the whole check of this run, or after the build of a tree whose check passed before.
  deploy:
    needs: [known, tests, shuffled, e2e, e2e-webkit, static, check, build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && ((needs.known.outputs.checked == 'true' && needs.build.result == 'success') || (needs.known.outputs.checked != 'true' && needs.tests.result == 'success' && needs.shuffled.result == 'success' && needs.e2e.result == 'success' && needs.e2e-webkit.result == 'success' && needs.static.result == 'success' && needs.check.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    # contents: write to tag the version deployed and publish its notes (ADR "Version from package.json").
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            package.json
            CHANGELOG.md
            apps/app/scripts/release.mjs
          sparse-checkout-cone-mode: false
      # Only the tip of master is deployed: a run of an older commit started again (to clear a red mark, or
      # one that waited while a newer one was merged and deployed) would put the older version back over
      # the newer, without a word. It ends here, green, with nothing deployed.
      - name: Is this still the tip of master?
        run: |
          tip=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/master | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "DEPLOY=true" >> "$GITHUB_ENV"; else echo "::notice::master is at $tip, this run is of $GITHUB_SHA: nothing deployed"; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.DEPLOY == 'true'
        with:
          name: builds
      - run: tar -xzf builds.tgz
        if: env.DEPLOY == 'true'

      - name: Sign in to AWS (deploy)
        if: env.DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The hashed files kept a year (a new build has new names), the rest checked on every visit;
      # old hashed files stay, so a page open during a deploy still finds its scripts.
      - name: Deploy the app
        if: env.DEPLOY == 'true'
        run: |
          aws s3 sync apps/app/.next-build/_next/static "s3://${{ vars.APP_BUCKET }}/_next/static" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/app/.next-build "s3://${{ vars.APP_BUCKET }}" --delete --exclude "_next/static/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.APP_DISTRIBUTION_ID }}" --paths "/*"

      - name: Deploy the site
        if: env.DEPLOY == 'true'
        run: |
          aws s3 sync apps/site/.next-build/_next/static "s3://${{ vars.SITE_BUCKET }}/_next/static" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/site/.next-build "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "_next/static/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" --paths "/*"

      # The version deployed tagged v<version> (0.1.0 as v0.1) with its notes from CHANGELOG.md, once:
      # a deploy of the same version later leaves the tag where it is.
      - name: Tag the version
        if: env.DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+)\.0$/\1/')"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is there already"; exit 0; fi
          node apps/app/scripts/release.mjs notes "$version" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "IsoStride ${tag#v}" --notes-file notes.md
