# The start of every job of CI/CD: Node and the packages, AWS through OIDC (the CI role of
# infra/ci.tf: the test data read, the reports of the run handed on), and the runner's FIT files.
name: Set up
description: Node, packages, AWS and the test FIT files
inputs:
  fit-files:
    description: Fetch the runner's FIT files into apps/app/test_data
    default: 'true'
  browsers:
    description: The end-to-end tests' browsers to install, e.g. chromium (cached by Playwright's version); none when empty
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm

    - run: npm ci
      shell: bash

    - name: Sign in to AWS (test data, read only; the run's reports)
      uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
      with:
        role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: The runner's FIT files
      if: inputs.fit-files == 'true'
      run: aws s3 sync "s3://${TEST_DATA_BUCKET}" apps/app/test_data --exclude "ci/*" --only-show-errors
      shell: bash

    - name: Playwright's version
      if: inputs.browsers != ''
      id: pw
      run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Browsers from the cache
      if: inputs.browsers != ''
      id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}

    - name: Browsers for the end-to-end tests
      if: inputs.browsers != ''
      working-directory: apps/app
      run: |
        if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps ${{ inputs.browsers }}; else npx playwright install --with-deps ${{ inputs.browsers }}; fi
      shell: bash
